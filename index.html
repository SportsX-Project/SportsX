<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SportsX - Sports Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SPORTS<span>X</span></h1>
        <p>Tournament & Performance Analytics Platform</p>
    </header>

    <main>

        <h2>Welcome to SportsX Dashboard</h2>
        <p>Manage players and track their performance.</p>

        <section class="stats">
            <div class="card">
                <h3>Total Players</h3>
                <h2 id="playerCount">0</h2>
            </div>

            <div class="card">
                <h3>Total Matches</h3>
                <h2 id="matchCount">0</h2>
            </div>

            <div class="card">
                <h3>Total Wins</h3>
                <h2 id="winCount">0</h2>
            </div>
        </section>

        <section class="panel">
            <h2>Register Player</h2>

            <form id="playerForm">

                <label>Player Name</label>
                <input type="text" id="playerName" required>

                <label>Sport Name</label>
                <input type="text" id="sportName" required>

                <label>Matches Played</label>
                <input type="number" id="matches" min="0" required>

                <label>Number of Wins</label>
                <input type="number" id="wins" min="0" required>

                <label>Base Points</label>
                <input type="number" id="basePoints" min="0" required>

                <label>Bonus Points</label>
                <input type="number" id="bonusPoints" min="0" required>

                <button type="submit">Register Player</button>

            </form>
        </section>

        <section class="panel">
            <h2>Player Performance</h2>

            <input type="text" id="searchName"
                   placeholder="Enter player name">

            <button onclick="searchPlayer()">Search Player</button>

            <button onclick="showAllPlayers()">Show All Players</button>

            <div id="playerResults"></div>
        </section>

        <section class="panel">
            <h2>Daily Match Details</h2>

            <form id="dailyForm">

                <label>Select Date</label>
                <input type="date" id="matchDate" required>

                <label>Matches Held</label>
                <input type="number" id="dailyMatchCount" min="0" required>

                <button type="submit">Save Match Details</button>

            </form>

            <div id="dailyResults"></div>
        </section>

    </main>

    <footer>
        <p>© 2026 SportsX Platform</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
